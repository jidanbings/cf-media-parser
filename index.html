<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="X-XSS-Protection" content="1; mode=block">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>访问验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:36px;max-width:380px;width:100%;box-shadow:0 2px 20px rgba(0,0,0,0.06)}
h1{font-size:20px;color:#1d1d1f;margin-bottom:6px;font-weight:600}
.sub{color:#888;font-size:14px;margin-bottom:24px}
input[type=password]{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;text-align:center;outline:none;transition:border-color .3s}
input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.12)}
.btn-go{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;transition:all .2s;margin-top:16px}
.btn-go:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(102,126,234,0.4)}
.err{color:#d00;font-size:13px;text-align:center;margin-top:12px;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h1>访问验证</h1>
  <p class="sub">请输入密钥以继续访问</p>
  <form action="/api/verify" method="POST" id="loginForm">
    <input type="password" name="key" placeholder="请输入访问密钥" autocomplete="current-password" autofocus>
    <button class="btn-go" type="submit">验证</button>
  </form>
  <p class="err" id="errMsg"></p>
</div>
<script>
(function(){
	// ========================================
	// 显示 URL 参数中的错误信息（后端重定向回来）
	// ========================================
	(function(){
	  var params = new URLSearchParams(window.location.search);
	  var error = params.get('error');
	  if (error) {
	    var errMsg = document.getElementById('errMsg');
	    errMsg.textContent = error;
	    errMsg.classList.add('show');
	  }
	})();
})();
</script>
</body>
</html>
