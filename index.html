<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="X-XSS-Protection" content="1; mode=block">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>访问验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:36px;max-width:380px;width:100%;box-shadow:0 2px 20px rgba(0,0,0,0.06)}
h1{font-size:20px;color:#1d1d1f;margin-bottom:6px;font-weight:600}
.sub{color:#888;font-size:14px;margin-bottom:24px}
input[type=password]{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;text-align:center;outline:none;transition:border-color .3s}
input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.12)}
.btn-go{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;transition:all .2s;margin-top:16px}
.btn-go:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(102,126,234,0.4)}
.err{color:#d00;font-size:13px;text-align:center;margin-top:12px;display:none}
.err.show{display:block}

/* 环境变量缺失提示 */
.env-error{display:none;text-align:center;padding:20px 0}
.env-error .icon{font-size:40px;margin-bottom:12px}
.env-error h2{font-size:18px;color:#1a1a1a;margin-bottom:8px}
.env-error p{font-size:13px;color:#888;line-height:1.6;margin-bottom:16px}
.env-error .missing-tag{display:inline-block;background:#fff0f0;color:#e53935;font-weight:600;font-family:monospace;padding:4px 12px;border-radius:6px;margin:4px;font-size:14px}
.env-error .steps-box{background:#f8f9ff;border:1px solid #e0e3f0;border-radius:8px;padding:14px;text-align:left;margin-top:14px}
.env-error .steps-box h3{font-size:13px;color:#333;margin-bottom:8px}
.env-error .steps-box ol{margin-left:16px;font-size:12px;color:#555;line-height:1.8}
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h1>访问验证</h1>
  <p class="sub">请输入密钥以继续访问</p>
  <form action="/api/verify" method="POST" id="loginForm">
    <input type="password" name="key" placeholder="请输入访问密钥" autocomplete="current-password" autofocus>
    <button class="btn-go" type="submit">验证</button>
  </form>
  <p class="err" id="errMsg"></p>
</div>
<div class="env-error" id="envError">
  <div class="icon">⚠️</div>
  <h2>环境变量未配置</h2>
  <p>缺少必要的环境变量，服务无法运行</p>
  <div id="missingList"></div>
  <div class="steps-box">
  <h3>配置方法</h3>
  <ol>
  <li>登录 <a href="https://dash.cloudflare.com" target="_blank" rel="noopener">Cloudflare Dashboard</a></li>
  <li>进入 Workers 和 Pages → 你的项目 → 设置 → 环境变量</li>
  <li>添加 <b>SECRET_KEY</b> 和 <b>JWT_SECRET</b> 两个变量</li>
  <li>添加后重新部署项目</li>
  </ol>
  </div>
</div>
<script>
(function(){
// ========================================
// 启动自检 — 检查 Worker 环境变量是否配置
// ========================================
fetch('/api/admin/info').then(function(r){
  if(r.status===500) return r.json().then(function(d){
    if(d&&d.code==='ENV_MISSING'){
      document.getElementById('loginCard').style.display='none';
      var envErr=document.getElementById('envError');
      var list=document.getElementById('missingList');
      list.innerHTML='';
      (d.missing||[]).forEach(function(v){
        var tag=document.createElement('span');
        tag.className='missing-tag';
        tag.textContent=v;
        list.appendChild(tag);
      });
      envErr.style.display='block';
    }
  });
}).catch(function(){});

// ========================================
// 显示 URL 参数中的错误信息（后端重定向回来）
// ========================================
(function(){
  var params = new URLSearchParams(window.location.search);
  var error = params.get('error');
  if (error) {
    var errMsg = document.getElementById('errMsg');
    errMsg.textContent = error;
    errMsg.classList.add('show');
  }
})();
})();
</script>
</body>
</html>
