<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>快手解析 · cf-media-parser</title>
<meta name="description" content="支持快手短视频与图文图集。采用多路由降级与 GraphQL 兜底，机房 IP 下建议配置 Cookie 以提升成功率。">
<meta name="theme-color" content="#f4f5f9">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/warmth.css">
<link rel="stylesheet" href="/assets/parse.css">
<style>
  /* ============ 快手页 · 简洁设计 ============ */
  :root {
    --accent: #FF4906;
    --accent-soft: rgba(255,73,6,.1);
  }
  body.is-dark { --accent: #FF6A33; --accent-soft: rgba(255,106,51,.14); }

  .container-wide { width:100%; max-width:1440px; margin:0 auto; padding:0 32px; }
  .page { padding:48px 0 var(--space-7); }

  /* ===== 页面头（简洁） ===== */
  .head { padding:8px 0 28px; }
  .head h1 { font-size:clamp(28px,3.5vw,36px); font-weight:800; letter-spacing:-.5px; line-height:1.1; color:var(--ink); margin-bottom:14px; }
  .head .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .head .chip { font-size:13px; font-weight:500; color:var(--accent);
    background:var(--accent-soft); border:1px solid rgba(255,73,6,.18); padding:6px 15px; border-radius:99px; }

  /* ===== 解析面板（长输入框 + 解析按钮） ===== */
  .search-panel { background:var(--glass); backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--glass-border); border-radius:var(--r-lg); padding:14px; box-shadow:var(--shadow-glass); }
  .searchbar { display:flex; align-items:center; gap:8px; width:100%; }
  .searchbar .input-shell { flex:1 1 auto; min-width:0; position:relative; }
  .searchbar .input { width:100%; min-width:0; height:42px; padding:0 48px 0 18px; font-size:15px;
    background:var(--glass-strong); border:1.5px solid var(--stroke); border-radius:10px; }
  .searchbar .input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .searchbar .parse-btn { height:42px; padding:0 24px; border:none; border-radius:10px; cursor:pointer;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600; font-family:inherit; flex-shrink:0;
    box-shadow:0 6px 20px -8px var(--accent); transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .searchbar .parse-btn:hover { transform:translateY(-1px); box-shadow:0 10px 28px -8px var(--accent); }
  .searchbar .parse-btn:active { transform:translateY(0) scale(.98); }
  .searchbar .parse-btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }

  /* 检测徽章 */
  .detect-badge { font-family:var(--font-mono); font-size:12px; color:var(--accent); margin-left:10px; opacity:0; transition:opacity var(--dur) var(--ease); }
  .detect-badge.is-visible { opacity:1; }

  /* 结果卡容器 */
  .result { margin-top:20px; }

  @media (max-width:760px) {
    .container-wide { padding:0 20px; }
  }
  @media (max-width:560px) {
    .container-wide { padding:0 16px; }
    .page { padding:28px 0 var(--space-7); }
    .head h1 { font-size:26px; }
    .head .chip { font-size:12px; padding:5px 12px; }
    .search-panel { padding:12px; border-radius:18px; }
    .searchbar { flex-wrap:wrap; }
    .searchbar .input-shell { flex:1 1 100%; }
    .searchbar .input { height:44px; font-size:14px; padding:0 44px 0 14px; }
    .searchbar .parse-btn { flex:1 1 100%; height:44px; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 详情 -->
<div class="modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="modal" style="max-width:720px;">
    <div class="modal-head">
      <h3 id="detailTitle">详情</h3>
      <button class="modal-x" type="button" data-action="close-detail" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-outline btn-sm" type="button" data-action="close-detail">关闭</button>
    </div>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
  <button class="lightbox-close" type="button" data-action="close-lightbox" aria-label="关闭">×</button>
  <button class="lightbox-nav prev" type="button" id="lightboxPrev" data-action="lightbox-prev" aria-label="上一张">‹</button>
  <img class="lightbox-img" id="lightboxImg" alt="">
  <video class="lightbox-video" id="lightboxVideo" muted loop playsinline controls></video>
  <button class="lightbox-nav next" type="button" id="lightboxNext" data-action="lightbox-next" aria-label="下一张">›</button>
  <div class="lightbox-bar">
    <span class="lightbox-count" id="lightboxCount"></span>
    <button type="button" data-action="copy-lightbox-url">复制图片链接</button>
  </div>
</div>

    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M12 2.5V21.5"/><path d="M3 7l9 4.5 9-4.5"/></svg>
      </span>
      <span class="brand-name">cf-media-parser</span>
    </a>
    <nav class="nav-center" aria-label="主导航">
      <a href="/">首页</a>
      <a href="/douyin">抖音</a>
      <a href="/kuaishou" class="is-active">快手</a>
      <a href="/bilibili">B站</a>
    </nav>
    <div class="header-actions">
      <span class="theme-group" role="group" aria-label="主题切换">
        <button type="button" data-action="set-theme" data-set-theme="light" aria-pressed="true" aria-label="浅色">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" data-action="set-theme" data-set-theme="system" aria-pressed="false" aria-label="跟随系统">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 20h8"/></svg>
        </button>
        <button type="button" data-action="set-theme" data-set-theme="dark" aria-pressed="false" aria-label="深色">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
      </span>
      <a class="btn btn-text" href="/">返回首页</a>
      <button class="hamburger" type="button" id="navToggle" data-action="toggle-nav" aria-label="打开菜单" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav">
  <a href="/">首页</a>
  <a href="/douyin">抖音</a>
  <a href="/kuaishou">快手</a>
  <a href="/bilibili">B站</a>
  <div class="theme-row">
    <span>主题</span>
    <span class="theme-group" role="group" aria-label="主题切换">
      <button type="button" data-action="set-theme" data-set-theme="light" aria-pressed="true" aria-label="浅色">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-action="set-theme" data-set-theme="system" aria-pressed="false" aria-label="跟随系统">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 20h8"/></svg>
      </button>
      <button type="button" data-action="set-theme" data-set-theme="dark" aria-pressed="false" aria-label="深色">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </span>
  </div>
</div>

<main class="page">
  <div class="container-wide">

    <!-- 页面头（简洁） -->
    <div class="head">
      <h1>快手解析</h1>
      <div class="chips">
        <span class="chip">短视频</span>
        <span class="chip">图文</span>
        <span class="chip">多路由降级</span>
      </div>
    </div>

    <!-- 解析面板 -->
    <section class="search-panel">
      <div class="searchbar">
        <div class="input-shell" style="flex:1;min-width:0;position:relative;">
          <input class="input" type="text" id="urlInput" placeholder="粘贴快手分享链接…" autocomplete="off" spellcheck="false">
          <button class="clear-btn" type="button" data-action="clear-url" aria-label="清空输入">×</button>
        </div>
        <button class="parse-btn" type="button" id="parseBtn" data-action="parse">解析</button>
      </div>
      <div style="display:flex;align-items:center;margin-top:10px;padding:0 4px;">
        <span class="detect-badge" id="detectBadge"></span>
      </div>
    </section>

    <div class="loading" id="loading">
      <div class="spinner spinner-lg"></div>
      <p id="loadLabel">正在解析…</p>
    </div>

    <div class="notice notice-error" id="error" role="alert">
      <span id="errorDetail"></span>
    </div>

    <section class="result" id="result" aria-live="polite"></section>

  </div>
</main>

<footer class="site-footer">
  <div class="container-wide">
    <div class="footer-bar" style="border-top:none;padding-top:0;">
      <span>© 2024–2026 cf-media-parser · <span class="mono">v5.0.8</span></span>
      <span>仅供学习研究</span>
    </div>
  </div>
</footer>

window.PLATFORM_CONFIG = {

  "match": ["kuaishou.com", "chenzhongtech.com", "gifshow.com", "kwai"]

</script>

</body>
</html>
